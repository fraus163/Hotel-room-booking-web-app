<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body th:fragment="container(content, activeTab)" class="align-items-center justify-content-center min-vh-100">
<header class="d-flex justify-content-between align-items-center px-5 py-3 bg-primary">
    <div class="d-flex justify-content-center align-items-center">
        <img th:src="@{/img/logo.png}" alt="" width="223" height="125">
        <h1 class="text-white">Волга Гранд Резиденс</h1>
    </div>
    <nav>
        <ul class="nav nav-underline">
            <li class="nav-item">
                <a class="nav-link text-white"
                   th:classappend="${activeTab == 'home'} ? 'active disabled'"
                   th:href="@{/}">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white"
                   th:classappend="${activeTab == 'rooms'} ? 'active disabled'"
                   th:href="@{/rooms}">Номера</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white"
                   th:classappend="${activeTab == 'profile'} ? 'active disabled'"
                   th:href="@{/profile}">Профиль</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <button type="button" class="btn text-white p-0 d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#exitModal">
                    <i class="bi bi-box-arrow-right p-2 fs-6 text-white"></i>
                </button>
            </li>
        </ul>
    </nav>
</header>
<main class="p-5">
    <form th:action="@{/logout}" method="post">
        <div class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" id="exitModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Выход из аккаунта</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Вы действительно хотите выйти из аккаунта?</p>
                    </div>
                    <div class="modal-footer">
                        <button id="cancelDialogBtn" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Подтвердить</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div th:replace="${content}"></div>
</main>
</body>
</html>
