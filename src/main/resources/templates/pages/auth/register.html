<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-sm border-0 p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
        <h1 class="h4 card-title text-center mb-1">Регистрация</h1>
        <p class="text-muted text-center small mb-4">Создайте аккаунт с именем пользователя и паролем</p>

        <div th:text="${param.error[0]}" th:if="${param.error}" class="alert alert-danger py-2 px-3 small" role="alert"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small text-muted">Логин</label>
                <input id="username"
                       name="username"
                       type="text"
                       class="form-control"
                       placeholder="Введите логин"
                       required
                       autofocus/>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small text-muted">Email</label>
                <input id="email"
                       name="email"
                       type="text"
                       class="form-control"
                       placeholder="Введите email"
                       required/>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small text-muted">Пароль</label>
                <input id="password"
                       name="password"
                       type="password"
                       class="form-control"
                       placeholder="Введите пароль"
                       required/>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Зарегистрироваться</button>
        </form>

        <div class="text-center">
            <small class="text-muted">
                Есть аккаунт? <a th:href="@{/login}" class="text-decoration-none">Войти</a>
            </small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
