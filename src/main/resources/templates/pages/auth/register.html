<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<form th:action="@{/register}" method="post" th:object="${registerDto}">
    <h1>Регистрация</h1>
    <div>
        <label for="username">Логин</label>
        <input th:field="*{username}" type="text" id="username" required autofocus>
    </div>
    <div>
        <label for="email">Email</label>
        <input th:field="*{email}" type="text" id="email" required>
    </div>
    <div>
        <label for="password">Пароль</label>
        <input th:field="*{password}" type="password" id="password" required>
    </div>
    <button type="submit">Зарегистрироваться</button>
</form>
</body>
</html>
