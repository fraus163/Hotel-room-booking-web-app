<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Номера</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
</head>
<body th:replace="~{fragments/layout :: container(~{::#content}, 'rooms')}">
    <div id="content" class="container-fluid container-lg flex-column d-flex align-items-center">
        <form class="d-flex justify-content-center gap-2 mb-4 w-100" style="max-width: 600px;" th:action="@{/rooms}" th:object="${filter}" method="get">
            <input th:field="*{name}" type="text" class="form-control" placeholder="Поиск">
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#exampleModal" title="Фильтры">
                    <i class="bi bi-filter"></i>
                </button>
                <button id="clearFilterBtn" type="button" class="btn btn-danger" title="Очистить">
                    <i class="bi bi-trash-fill"></i>
                </button>
            </div>
            <button type="submit" class="btn btn-primary">Найти</button>
            <div class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Фильтр номеров</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
                                <div class="w-100">
                                    <label for="priceFrom" class="form-label small text-muted">Цена от</label>
                                    <input type="number"
                                           th:field="*{priceFrom}"
                                           min="1"
                                           class="form-control"
                                           placeholder="Введите цену"
                                           autofocus/>
                                </div>
                                <div class="w-100">
                                    <label for="priceTo" class="form-label small text-muted">Цена до</label>
                                    <input type="number"
                                           th:field="*{priceTo}"
                                           min="1"
                                           class="form-control"
                                           placeholder="Введите цену"/>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="area" class="form-label small text-muted">Площадь</label>
                                <input type="number"
                                       th:field="*{area}"
                                       min="1"
                                       class="form-control"
                                       placeholder="Введите площадь"/>
                            </div>
                            <div>
                                <label for="people" class="form-label small text-muted">Кол-во людей</label>
                                <input type="number"
                                       th:field="*{people}"
                                       min="1"
                                       class="form-control"
                                       placeholder="Введите кол-во людей"/>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button id="cancelDialogBtn" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button id="submitDialogBtn" type="button" class="btn btn-primary" data-bs-dismiss="modal">Сохранить</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="d-flex align-items-center justify-content-center py-5" th:if="${rooms.isEmpty()}">
            <h2 class="text-muted text-center">Нет доступных номеров :(</h2>
        </div>
        <div class="container-fluid px-0" th:unless="${rooms.isEmpty()}">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4 justify-content-center">
                <div class="col" th:each="room : ${rooms.getContent()}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h2 th:text="${room.name()}" class="card-title fs-4"></h2>
                            <p class="card-text text-secondary" th:text="${room.description()}"></p>
                            <div class="container p-0">
                                <div class="d-flex flex-wrap gap-1">
                                    <div th:each="tag : ${room.tags()}">
                                        <span class="badge bg-success" th:text="${tag.name()}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <p class="mb-0">
                                    <i class="bi bi-people-fill"></i>
                                    <span th:text="${room.people()}"></span>
                                    чел.
                                </p>
                            </li>
                            <li class="list-group-item">
                                <p class="mb-0">
                                    <i class="bi bi-house-door-fill"></i>
                                    <span th:text="${room.area()}"></span>
                                    кв.м.
                                </p>
                            </li>
                            <li class="list-group-item">
                                <p class="mb-0">
                                    <i class="bi bi-cash-stack"></i>
                                    <span th:text="${room.pricePerNight()}"></span>
                                    руб./ночь
                                </p>
                            </li>
                        </ul>
                        <div class="card-body d-flex align-items-end" style="max-height: 70px">
                            <a class="btn btn-primary w-100" th:href="@{/rooms/{id}(id=${room.id()})}">Забронировать</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav aria-label="..." th:unless="${rooms.isEmpty()}" class="mt-4">
            <ul class="pagination flex-wrap justify-content-center">
                <li class="page-item"
                    th:classappend="${!rooms.hasPrevious()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/rooms(page=${rooms.getNumber() - 1},
                                        size=8,
                                        name=${filter.getName()},
                                        priceFrom=${filter.getPriceFrom()},
                                        priceTo=${filter.getPriceTo()},
                                        area=${filter.getArea()},
                                        people=${filter.getPeople()})}">
                        Назад
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(startPage, endPage)}" class="page-item"
                    aria-current=""
                    th:attrappend="aria-content=${rooms.getNumber() + 1 == i} ? 'page': ''"
                    th:classappend="${rooms.getNumber() + 1 == i} ? 'active'">
                    <a th:text="${i}"
                       class="page-link"
                       th:href="@{/rooms(page=${i - 1},
                                        size=8,
                                        name=${filter.getName()},
                                        priceFrom=${filter.getPriceFrom()},
                                        priceTo=${filter.getPriceTo()},
                                        area=${filter.getArea()},
                                        people=${filter.getPeople()})}"></a>
                </li>
                <li class="page-item"
                    th:classappend="${!rooms.hasNext()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/rooms(page=${rooms.getNumber() + 1},
                                        size=8,
                                        name=${filter.getName()},
                                        priceFrom=${filter.getPriceFrom()},
                                        priceTo=${filter.getPriceTo()},
                                        area=${filter.getArea()},
                                        people=${filter.getPeople()})}"
                    >
                        Вперед
                    </a>
                </li>
            </ul>
        </nav>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:inline="javascript">
            let priceFrom = [[${filter.priceFrom}]];
            let priceTo = [[${filter.priceTo}]];
            let area = [[${filter.area}]];
            let people = [[${filter.people}]];

            const submitDialogBtn = document.getElementById('submitDialogBtn');
            const cancelDialogBtn = document.getElementById('cancelDialogBtn');
            const clearFilerBtn = document.getElementById('clearFilterBtn');

            const priceFromField = document.getElementById('priceFrom');
            const priceToField = document.getElementById('priceTo');
            const areaField = document.getElementById('area');
            const peopleField = document.getElementById('people');

            submitDialogBtn.addEventListener('click', () => {
                priceFrom = priceFromField.value;
                priceTo = priceToField.value;
                area = areaField.value;
                people = peopleField.value;
            });

            cancelDialogBtn.addEventListener('click', () => {
                priceFromField.value = priceFrom;
                priceToField.value = priceTo;
                areaField.value = area;
                peopleField.value = people;
            });

            clearFilerBtn.addEventListener('click', () => {
                priceFromField.value = '';
                priceFrom = null;

                priceToField.value = '';
                priceTo = null;

                areaField.value = '';
                area = null;

                peopleField.value = '';
                people = null;
            });
        </script>
    </div>
</body>
</html>
