<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Номера</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
</head>
<body th:replace="~{fragments/layout :: container(~{::#content}, 'rooms')}">
    <div id="content" class="container flex-column d-flex align-items-center" style="height: 100vh">
        <div class="container">
            <div class="row row-cols-auto">
                <div class="col mb-4" th:each="room : ${rooms.getContent()}">
                    <div class="card" style="width: 18rem; height: 100%">
                        <div class="card-body">
                            <h1 th:text="${room.getName()}" class="card-title"></h1>
                            <p class="card-text" th:text="${room.getDescription()}"></p>
                            <div class="container p-0">
                                <div class="row row-cols-auto">
                                    <div th:each="tag : ${room.getTags()}">
                                        <h4 class="bg-success p-2 rounded fs-6 text-light" th:text="${tag.getName()}"></h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <p>
                                    <i class="bi bi-people-fill"></i>
                                    <span th:text="${room.getPeople()}"></span>
                                    чел.
                                </p>
                            </li>
                            <li class="list-group-item">
                                <p>
                                    <i class="bi bi-house-door-fill"></i>
                                    <span th:text="${room.getArea()}"></span>
                                    кв.м.
                                </p>
                            </li>
                            <li class="list-group-item">
                                <p>
                                    <i class="bi bi-cash-stack"></i>
                                    <span th:text="${room.getPricePerNight()}"></span>
                                    руб./ночь
                                </p>
                            </li>
                        </ul>
                        <div class="card-body" style="max-height: 70px">
                            <a class="btn btn-primary" th:href="@{/rooms/{id}(id=${room.getId()})}">Забронировать</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav aria-label="...">
            <ul class="pagination">
                <li class="page-item"
                    th:classappend="${!rooms.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/rooms(page=${rooms.getNumber() - 1}, size=8)}">Назад</a>
                </li>
                <li th:each="i : ${#numbers.sequence(startPage, endPage)}" class="page-item"
                    aria-current=""
                    th:attrappend="aria-content=${rooms.getNumber() + 1 == i} ? 'page': ''"
                    th:classappend="${rooms.getNumber() + 1 == i} ? 'active'">
                    <a th:text="${i}" class="page-link" th:href="@{/rooms(page=${i - 1}, size=8)}"></a>
                </li>
                <li class="page-item"
                    th:classappend="${!rooms.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/rooms(page=${rooms.getNumber() + 1}, size=8)}">Вперед</a>
                </li>
            </ul>
        </nav>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
