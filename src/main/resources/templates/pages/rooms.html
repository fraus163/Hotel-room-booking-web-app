<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Номера</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
</head>
<body th:replace="~{fragments/layout :: container(~{::#content}, 'rooms')}">
    <div id="content" class="container flex-column d-flex justify-content-center align-items-center">
        <dialog id="dialog" class="border border-secondary rounded">
            <div class="card">
                <form th:action="@{/reservations}" method="post" th:object="${reservationDto}">
                    <div class="card-body">
                        <input type="hidden" name="roomId" id="roomId">
                        <h1 class="card-title" id="roomName"></h1>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <div>
                                <label class="form-label small text-muted" for="days">Количество дней для бронирования</label>
                                <input class="form-control"
                                       th:field="*{days}"
                                       type="number"
                                       id="days"
                                       min="1"
                                       max="30"
                                       required
                                       autofocus
                                       placeholder="Выберите кол-во дней">
                            </div>
                        </li>
                        <li class="list-group-item">
                            <div>
                                <label class="form-label small text-muted" for="arrivalDate">Дата заселения</label>
                                <input class="form-control"
                                       th:field="*{arrivalDate}"
                                       type="date"
                                       id="arrivalDate"
                                       required>
                            </div>
                        </li>
                    </ul>
                    <div class="card-body">
                        <button class="btn btn-success" type="submit">Забронировать</button>
                        <button class="btn btn-danger" type="button" onclick="dialog.close()">Закрыть</button>
                    </div>
                </form>
            </div>
        </dialog>
        <div class="container">
            <div class="row row-cols-auto">
                <div class="col mb-4" th:each="room : ${rooms.getContent()}">
                    <div class="card border border-info" style="width: 18rem; height: 100%">
                        <div class="card-body">
                            <h1 th:text="${room.getName()}" class="card-title"></h1>
                            <p class="card-text" th:text="${room.getDescription()}"></p>
                            <div class="container p-0">
                                <div class="row row-cols-auto">
                                    <div th:each="tag : ${room.getTags()}">
                                        <h4 class="bg-success p-2 rounded fs-6 text-light" th:text="${tag.getName()}"></h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <p>
                                    <i class="bi bi-people-fill"></i>
                                    <span th:text="${room.getPeople()}"></span>
                                    чел.
                                </p>
                            </li>
                            <li class="list-group-item">
                                <p>
                                    <i class="bi bi-house-door-fill"></i>
                                    <span th:text="${room.getArea()}"></span>
                                    кв.м.
                                </p>
                            </li>
                            <li class="list-group-item">
                                <p>
                                    <i class="bi bi-cash-stack"></i>
                                    <span th:text="${room.getPricePerNight()}"></span>
                                    руб./ночь
                                </p>
                            </li>
                        </ul>
                        <div class="card-body">
                            <button
                                    th:data-id="${room.id}"
                                    th:data-name="${room.name}"
                                    th:onclick="|openDialog(this.dataset.id, this.dataset.name)|"
                                    class="btn btn-primary"
                            >
                                Забронировать
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav aria-label="...">
            <ul class="pagination">
                <li class="page-item"
                    th:classappend="${!rooms.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/rooms(page=${rooms.getNumber() - 1}, size=8)}">Назад</a>
                </li>
                <li th:each="i : ${#numbers.sequence(startPage, endPage)}" class="page-item"
                    aria-current=""
                    th:attrappend="aria-content=${rooms.getNumber() + 1 == i} ? 'page': ''"
                    th:classappend="${rooms.getNumber() + 1 == i} ? 'active'">
                    <a th:text="${i}" class="page-link" th:href="@{/rooms(page=${i - 1}, size=8)}"></a>
                </li>
                <li class="page-item"
                    th:classappend="${!rooms.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/rooms(page=${rooms.getNumber() + 1}, size=8)}">Вперед</a>
                </li>
            </ul>
        </nav>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const dialog = document.getElementById("dialog");

            function openDialog(roomId, roomName) {
                document.getElementById("roomId").value = roomId;
                document.getElementById("roomName").textContent = roomName;
                dialog.showModal();
            }

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('arrivalDate').setAttribute('min', today);
        </script>
    </div>
</body>
</html>
