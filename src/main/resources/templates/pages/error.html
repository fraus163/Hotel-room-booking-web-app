<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
</head>
<body class="min-vh-100 d-flex justify-content-center align-items-center p-4">
    <div class="card text-center shadow-sm p-3">
        <div class="card-body">
            <h1 class="card-title text-danger" th:text="${httpStatus}"></h1>
            <p class="card-text fs-5" th:text="${errorMessage}"></p>
            <a class="btn btn-primary mt-3" th:href="@{/}">На главную</a>
        </div>
    </div>
</body>
</html>
