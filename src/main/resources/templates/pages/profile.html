<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
</head>
<body th:replace="~{fragments/layout :: container(~{::#content}, 'profile')}">
    <div id="content" class="d-flex flex-column">
        <div class="card mb-4">
            <div class="card-body">
                <h1 class=" card-title mb-4">Информация о профиле</h1>
                <div class="d-flex gap-4">
                    <div class="d-flex align-items-baseline gap-2">
                        <label class="h4" for="login">Имя:</label>
                        <h4 id="login" th:text="${user.username()}"></h4>
                    </div>
                    <div class="d-flex align-items-baseline gap-2">
                        <label class="h4" for="email">Email:</label>
                        <h4 id="email" th:text="${user.email()}"></h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <h1 class="card-title mb-4">Заказы</h1>
                <div class="container p-0 m-0">
                    <div class="row row-cols-auto">
                        <div class="col mb-4" th:each="reservation : ${user.reservations()}">
                            <div class="card" style="width: 18rem; height: 100%">
                                <div class="card-body">
                                    <h1 th:text="${reservation.room().name()}" class="card-title"></h1>
                                </div>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item">
                                        <label for="arrivalDate" class="form-label small text-muted">Дата заселения</label>
                                        <h4 id="arrivalDate" th:text="${reservation.arrivalDate()}"></h4>
                                    </li>
                                    <li class="list-group-item">
                                        <label for="days" class="form-label small text-muted">Дней пребывания</label>
                                        <h4 id="days" th:text="${reservation.days()}"></h4>
                                    </li>
                                    <li class="list-group-item">
                                        <label for="fullPrice" class="form-label small text-muted">Полная стоимость</label>
                                        <h4 id="fullPrice">
                                            <span th:text="${reservation.fullPrice()}"></span>
                                            руб.
                                        </h4>
                                    </li>
                                    <li class="list-group-item">
                                        <label for="status" class="form-label small text-muted">Статус заявки</label>
                                        <h4 id="status" th:switch="${reservation.status().name()}">
                                            <span th:case="'STATUS_PENDING'">В ожидании</span>
                                            <span th:case="'STATUS_APPROVED'">Принято</span>
                                            <span th:case="'STATUS_CANCELLED'">Закрыто</span>
                                            <span th:case="*">Неизвестный статус</span>
                                        </h4>
                                    </li>
                                    <li class="list-group-item">
                                        <label for="createdAt" class="form-label small text-muted">Дата и время отпрвления заявки</label>
                                        <h4 id="createdAt" th:text="${#temporals.format(
                                                            reservation.createdAt().atZone(T(java.time.ZoneId).of('Europe/Moscow')),
                                                            'dd.MM.yyyy HH:mm')}"></h4>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-center align-items-center">
                    <nav aria-label="...">
                        <ul class="pagination">
                            <li class="page-item"
                                th:classappend="${!user.reservations().hasPrevious()} ? 'disabled'">
                                <a class="page-link" th:href="@{/profile(page=${user.reservations().getNumber() - 1}, size=8)}">Назад</a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(startPage, endPage)}" class="page-item"
                                aria-current=""
                                th:attrappend="aria-content=${user.reservations().getNumber() + 1 == i} ? 'page': ''"
                                th:classappend="${user.reservations().getNumber() + 1 == i} ? 'active'">
                                <a th:text="${i}" class="page-link" th:href="@{/profile(page=${i - 1}, size=8)}"></a>
                            </li>
                            <li class="page-item"
                                th:classappend="${!user.reservations().hasNext()} ? 'disabled'">
                                <a class="page-link" th:href="@{/profile(page=${user.reservations().getNumber() + 1}, size=8)}">Вперед</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
