<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${room.name()}"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body th:replace="~{fragments/layout :: container(~{::#content}, 'rooms')}">
    <div id="content">
        <form class="d-flex justify-content-center align-items-center" th:object="${reservation}" th:action="@{/reservations}" method="post">
            <div class="card">
                <div class="card-body">
                    <input id="roomId" name="roomId" type="hidden" th:value="${room.id()}">
                    <h1 class="card-title" th:text="${room.name()}"></h1>
                    <p class="card-text" th:text="${room.description()}"></p>
                    <div class="container p-0">
                        <div class="row row-cols-auto">
                            <div th:each="tag : ${room.tags()}">
                                <h4 class="bg-success p-2 rounded fs-6 text-light" th:text="${tag.name()}"></h4>
                            </div>
                        </div>
                    </div>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <p>
                            <i class="bi bi-people-fill"></i>
                            <span th:text="${room.people()}"></span>
                            чел.
                        </p>
                    </li>
                    <li class="list-group-item">
                        <p>
                            <i class="bi bi-house-door-fill"></i>
                            <span th:text="${room.area()}"></span>
                            кв.м.
                        </p>
                    </li>
                    <li class="list-group-item">
                        <p>
                            <i class="bi bi-cash-stack"></i>
                            <span th:text="${room.pricePerNight()}"></span>
                            руб./ночь
                        </p>
                    </li>
                </ul>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <div>
                            <label class="form-label small text-muted" for="days">Количество дней для бронирования</label>
                            <input class="form-control"
                                   th:field="*{days}"
                                   type="number"
                                   id="days"
                                   min="1"
                                   max="30"
                                   required
                                   autofocus
                                   placeholder="Выберите кол-во дней">
                        </div>
                    </li>
                    <li class="list-group-item">
                        <div>
                            <label class="form-label small text-muted" for="arrivalDate">Дата заселения</label>
                            <input class="form-control"
                                   th:field="*{arrivalDate}"
                                   type="date"
                                   id="arrivalDate"
                                   required>
                        </div>
                    </li>
                </ul>
                <div class="card-body">
                    <button class="btn btn-success" type="submit">Забронировать</button>
                    <a class="btn btn-danger" th:href="@{/rooms}">Отмена</a>
                </div>
            </div>
        </form>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('arrivalDate').setAttribute('min', today);
        </script>
    </div>
</body>
</html>
